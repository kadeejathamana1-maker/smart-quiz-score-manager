<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Smart Quiz & Score Manager</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="quiz-container">
        <h1>Smart Quiz</h1>
        <p>Test Your Knowledge!</p>

        <div id="quiz">
            <h2 id="question">Question will appear here</h2>

            <div id="answer-buttons">
                <button class="answer-btn">Option A</button>
                <button class="answer-btn">Option B</button>
                <button class="answer-btn">Option C</button>
                <button class="answer-btn">Option D</button>
            </div>

            <button id="next-btn">Next Question</button>
        </div>

        <div id="result"></div>
    </div>

    <script src="script.js"></script>
</body>
</html>
